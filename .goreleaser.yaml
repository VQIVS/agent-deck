version: 2
builds:
  - main: .
    binary: agent-deck
    env: [CGO_ENABLED=0]
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
archives:
  - formats: [tar.gz]
    files: [LICENSE, README.md, CHANGELOG.md]
checksum:
  name_template: checksums.txt
homebrew_casks:
  - name: agent-deck
    repository:
      owner: VQIVS
      name: homebrew-tap
    homepage: https://github.com/VQIVS/agent-deck
    description: Terminal dashboard for local OpenCode sessions and teams
    license: MIT
    binaries: [agent-deck]
    dependencies:
      - formula: opencode
      - formula: git
    caveats: |
      agent-deck binaries are not notarized. If macOS blocks the first run, install with
      `brew install --cask --no-quarantine vqivs/tap/agent-deck`, or run
      `xattr -dr com.apple.quarantine "$(brew --prefix)/bin/agent-deck"`.
release:
  github:
    owner: VQIVS
    name: agent-deck
changelog:
  use: git
